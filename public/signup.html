<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <link rel="stylesheet" href="https://localhost/website-comp-alt/public/css/signup.css">
</head>
<body>
    <div class="container">
        <div class="title-container">
            <div class="title-wrapper">
                <h1>Sign Up</h1>
            </div>
        </div>
        <div class="login-container">
            <div class="login-wrapper">
                <form method="post" id="login">
                    <div class="main">
                        <div class="username">
                            <label for="username">Username: </label>
                            <input type="text" id="username" placeholder="luisgamercool23" required>
                        </div>
                        <div class="email">
                            <label for="email">Email: </label>
                            <input type="email" id="email" placeholder="luisgamercool23@example.com" required>
                        </div>
                        <div class="password">
                            <label for="password">Password: </label>
                            <input type="password" id="password" placeholder="........." required>
                        </div>
                         <div class="confirm-password">
                            <label for="confirmpassword">Confirm : </label>
                            <input type="password" id="confirmpassword" placeholder="........." required>
                        </div>
                        <div class="submit">
                            <input type="submit" value="Submit" id="submit">
                        </div>
                        <div class="prompt">
                            <span>Already have an account? <a href="https://localhost/website-comp-alt/login">Login</a></span>
                        </div>
                        <div class="return">
                            <a href="https://localhost/website-comp-alt/">Home Screen</a>
                        </div>
                    </div>
                    <div class="copyright">
                        <span>
                            Copyright &copy; kahezra.
                        </span>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script type="module" src="https://localhost/website-comp-alt/js/document/signup.js"></script>
</body>
</html>
