<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="https://localhost/website-comp-alt/public/css/signup.css">
</head>
<body>
    <div class="container">
        <div class="title-container">
            <div class="title-wrapper">
                <h1>Login</h1>
            </div>
        </div>
        <div class="login-container">
            <div class="login-wrapper">
                <form method="get" id="login">
                    <div class="main">
                        <div class="username">
                            <label for="username">Username: </label>
                            <input type="text" id="username" placeholder="luisgamercool23" required>
                        </div>
                        <div class="password">
                            <label for="password">Password: </label>
                            <input type="password" id="password" placeholder="........." required>
                        </div>
                        <div class="submit">
                            <input type="submit" value="Submit" id="submit">
                        </div>
                        <div class="prompt">
                            <span>Don't have an account yet? <a href="https://localhost/website-comp-alt/signup">Sign up</a></span>
                        </div>
                        <div class="return">
                            <a href="https://localhost/website-comp-alt/">Home Screen</a>
                        </div>
                    </div>
                    <div class="copyright">
                        <span>
                            Copyright &copy; kahezra.
                        </span>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script type="module" src="https://localhost/website-comp-alt/js/document/login.js"></script>
</body>
</html>
